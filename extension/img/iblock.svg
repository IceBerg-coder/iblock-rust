<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="stemGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer ambient glow -->
  <path d="M 64 8 L 110 24 C 110 50 110 75 92 100 C 78 114 64 120 64 120 C 64 120 50 114 36 100 C 18 75 18 50 18 24 Z"
        fill="#06b6d4" opacity="0.25" filter="url(#neonGlow)"/>

  <!-- Main Shield Body -->
  <path d="M 64 10 L 108 25 C 108 50 108 73 91 97 C 78 110 64 117 64 117 C 64 117 50 110 37 97 C 20 73 20 50 20 25 Z"
        fill="url(#shieldBg)" stroke="url(#shieldBorder)" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Inner Inset Shield -->
  <path d="M 64 19 L 99 31 C 99 51 99 69 85 89 C 74 100 64 106 64 106 C 64 106 54 100 43 89 C 29 69 29 51 29 31 Z"
        fill="url(#innerGlow)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" stroke-linejoin="round"/>

  <!-- Dot of the 'i' (Diamond Core) -->
  <polygon points="64,36 73,46 64,56 55,46"
           fill="#f0fdf4" stroke="#38bdf8" stroke-width="2.2" filter="url(#neonGlow)"/>

  <!-- Center highlight of the diamond -->
  <polygon points="64,41 69,46 64,51 59,46"
           fill="#38bdf8" opacity="0.9"/>

  <!-- Stem of the 'i' -->
  <rect x="56.5" y="63" width="15" height="32" rx="7.5"
        fill="url(#stemGradient)" filter="url(#neonGlow)"/>

  <!-- Glass reflection highlight on stem -->
  <line x1="60" y1="67" x2="60" y2="88"
        stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
</svg>
