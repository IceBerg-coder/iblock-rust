name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test & Build iBlock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.129

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Formatting & Lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust Workspace Unit Tests
        run: cargo test --workspace --verbose

      - name: Build WebAssembly Engine
        run: make wasm

      - name: Run Integration Tests
        run: node tests/test-wasm.mjs

      - name: Package MV3 Extension
        run: make extension

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iblock-extension
          path: dist/iblock-extension.zip
